[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egfr-trajectory-aki-detector"
version = "3.0.0"
description = "eGFR Trajectory & AKI Detector — KDIGO AKI staging plus eGFR slope and rapid-decline flagging."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Egfr Trajectory Aki Detector Team"},
]
keywords = ["egfr", "aki", "kdigo", "nephrology", "clinical", "biomedical"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
egfr-trajectory = "cli:main"

[tool.setuptools]
py-modules = ["cli", "egfr_trajectory", "renal_trajectory", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]

version: '3.8'

services:
  egfr-trajectory-aki-detector:
    build: .
    container_name: egfr-trajectory-aki-detector
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=egfr-trajectory-aki-detector-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

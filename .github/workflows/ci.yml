name: Egfr Trajectory Aki Detector CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'

    - name: Audit resolved Python dependencies
      run: |
        python -m pip install pip-audit
        pip-audit -r requirements.txt

    - name: Compile Python and validate browser JavaScript
      run: |
        python -m compileall -q agents cli.py egfr_trajectory.py renal_trajectory.py
        node --check app.js
        node --check ui.js
        node tests/test_browser.js
        python cli.py trajectory -i sample_renal_trajectory.json > /tmp/renal-result.json
        python egfr_trajectory.py trajectory --input sample_renal_trajectory.json > /tmp/renal-direct.json
        python -c 'import json; assert json.load(open("/tmp/renal-result.json"))["aki_stage"] == 1; assert json.load(open("/tmp/renal-direct.json"))["aki_stage"] == 1'

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Verify empty audit-chain integrity
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Audit chain empty-state check passed')
        "
